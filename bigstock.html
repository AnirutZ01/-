<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบนับสต็อกสินค้าคาเฟ่ (Cafe Stock Counter)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            50: '#FDFBF7',
                            100: '#F7F2E8',
                            200: '#EBE0CE',
                            300: '#D5BE9B',
                            400: '#BC9A6C',
                            500: '#9E7743',
                            600: '#805A32',
                            700: '#644426',
                            800: '#4A311D',
                            900: '#332014',
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for better visual feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F7F2E8;
        }
        ::-webkit-scrollbar-thumb {
            background: #D5BE9B;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #BC9A6C;
        }
        /* Hide HTML5 Number Input Spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-cafe-50 text-cafe-900 min-h-screen flex flex-col font-sans pb-24">

    <!-- Header Section -->
    <header class="bg-white border-b border-cafe-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-cafe-500 flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid font-bold fa-mug-hot"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-cafe-800 leading-tight">Cafe Stock Counter</h1>
                    <p class="text-xs text-cafe-500">ระบบช่วยนับสต็อกวัตถุดิบและอุปกรณ์คาเฟ่</p>
                </div>
            </div>

            <!-- Search & Filter -->
            <div class="relative w-full sm:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-cafe-400"></i>
                <input type="text" id="searchInput" oninput="renderItems()" placeholder="ค้นหารายการ..." 
                    class="w-full pl-9 pr-4 py-2 bg-cafe-50 border border-cafe-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cafe-400 focus:bg-white transition-all">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full px-4 pt-6 flex-grow">
        <!-- Action Toolbar -->
        <div class="flex items-center justify-between bg-white p-3 sm:p-4 rounded-2xl border border-cafe-200 mb-6 shadow-sm">
            <div class="flex items-center space-x-2 text-xs sm:text-sm text-cafe-600">
                <i class="fa-solid fa-list-check text-cafe-500"></i>
                <span>นับแล้ว <strong id="countedCount" class="text-cafe-700">0</strong> / <span id="totalItemsCount">0</span> รายการ</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="resetAllInputs()" class="px-3 py-1.5 text-xs sm:text-sm font-medium text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-left"></i> ล้างข้อมูล
                </button>
            </div>
        </div>

        <!-- Inventory List Container -->
        <div id="itemsContainer" class="space-y-4">
            <!-- Dynamic Items Inserted via JS -->
        </div>
    </main>

    <!-- Bottom Sticky Bar for Quick Summary Trigger -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-cafe-200 p-3 z-30 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <div>
                <span class="text-xs text-cafe-500 block">ยอดรวมรายการที่นับ</span>
                <span class="text-lg font-bold text-cafe-800" id="stickyTotalUnits">0 รายการ</span>
            </div>
            <button onclick="openSummaryModal()" class="px-6 py-2.5 bg-cafe-600 hover:bg-cafe-700 active:scale-95 text-white font-medium rounded-xl shadow-md flex items-center space-x-2 transition-all">
                <i class="fa-solid fa-clipboard-check text-lg"></i>
                <span>สรุปรายการทั้งหมด</span>
            </button>
        </div>
    </div>

    <!-- Summary Modal -->
    <div id="summaryModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="modalContent">
            <!-- Modal Header -->
            <div class="p-4 sm:p-5 bg-cafe-800 text-white flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-receipt text-cafe-300 text-xl"></i>
                    <h3 class="font-bold text-lg">สรุปสต็อกสินค้าคงเหลือ</h3>
                </div>
                <button onclick="closeSummaryModal()" class="text-cafe-300 hover:text-white text-xl w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors">
                    &times;
                </button>
            </div>

            <!-- Modal Body (Text Summary Output) -->
            <div class="p-4 sm:p-5 overflow-y-auto flex-grow space-y-4">
                <p class="text-xs text-cafe-500">คัดลอกข้อความสรุปด้านล่างเพื่อส่งต่อใน Line หรือบันทึกเก็บไว้</p>
                <textarea id="summaryTextArea" readonly class="w-full h-64 p-3 bg-cafe-50 border border-cafe-200 rounded-xl text-xs sm:text-sm font-mono text-cafe-900 focus:outline-none resize-none leading-relaxed"></textarea>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 bg-cafe-50 border-t border-cafe-200 flex flex-wrap gap-2 justify-end">
                <button onclick="copySummaryText()" id="copyBtn" class="flex-1 sm:flex-none px-4 py-2 bg-cafe-600 hover:bg-cafe-700 text-white font-medium text-sm rounded-xl flex items-center justify-center space-x-2 transition-colors">
                    <i class="fa-solid fa-copy"></i>
                    <span id="copyBtnText">คัดลอกข้อความ</span>
                </button>
                <button onclick="closeSummaryModal()" class="px-4 py-2 bg-cafe-200 hover:bg-cafe-300 text-cafe-800 font-medium text-sm rounded-xl transition-colors">
                    ปิด
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-cafe-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 z-50 transform translate-y-[-150%] transition-transform duration-300">
        <i class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toastMsg" class="text-sm">คัดลอกเรียบร้อยแล้ว</span>
    </div>

    <script>
        // Item List Configuration according to specification
        const initialItems = [
            { id: 'item_1', name: 'นมข้นหวาน', unit: 'ขวด', packSize: 0 },
            { id: 'item_2', name: 'นมข้นจืด', unit: 'ขวด', packSize: 0 },
            { id: 'item_3', name: 'Cake box', unit: 'ชิ้น', packSize: 0 },
            { id: 'item_4', name: 'Hot cup (แก้วร้อนฟ้า)', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_5', name: '16oz cup (แก้วเย็น)', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_6', name: 'Bite satchel (ถุงขนม)', unit: 'ชิ้น', packSize: 0 },
            { id: 'item_7', name: 'Parchment paper (แผ่นรองอบขนม)', unit: 'ชิ้น', packSize: 0 },
            { id: 'item_8', name: 'หลอด', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_9', name: '2Bag (ถุง 2)', unit: 'ชิ้น', packSize: 25 },
            { id: 'item_10', name: 'สติ๊กเกอร์แจก Deli', unit: 'ชิ้น', packSize: 500 },
            { id: 'item_11', name: 'สติ๊กเกอร์เก่า', unit: 'ชิ้น', packSize: 1000 },
            { id: 'item_12', name: 'Cup sleeves', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_13', name: '4 Carrier (รังไข่ 4)', unit: 'ชิ้น', packSize: 75 },
            { id: 'item_14', name: '2 Carrier (รังไข่ 2)', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_15', name: '4cupbag (ถุง 4)', unit: 'ชิ้น', packSize: 25 },
            { id: 'item_16', name: 'Insulated bag (ถุง deli)', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_17', name: 'Black cup lid (ฝาดำ)', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_18', name: 'White cup lid (ฝาร้อนขาว)', unit: 'ชิ้น', packSize: 50 },
            { id: 'item_19', name: '16oz cup lid (ฝาแก้วเย็น 16oz)', unit: 'ชิ้น', packSize: 100 },
            { id: 'item_20', name: 'Dome cup lid (ฝาโดม)', unit: 'ชิ้น', packSize: 100 },
            { id: 'item_21', name: 'Napkin (ทิชชู่ลูกค้าอันเล็ก)', unit: 'ชิ้น', packSize: 100 },
            { id: 'item_22', name: 'Wooden spoon', unit: 'ชิ้น', packSize: 100 },
            { id: 'item_23', name: 'Wooden fork', unit: 'ชิ้น', packSize: 100 }
        ];

        // State to keep dynamic input data
        // Form: { item_id: { packs: number, pieces: [number, number, ...] } }
        let itemStates = {};

        function initData() {
            initialItems.forEach(item => {
                itemStates[item.id] = {
                    packs: 0,
                    pieces: [0] // Starts with 1 dynamic input field for pieces
                };
            });
            document.getElementById('totalItemsCount').textContent = initialItems.length;
            renderItems();
        }

        // Render List of Items
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            container.innerHTML = '';

            let totalCounted = 0;

            initialItems.forEach((item) => {
                if (searchVal && !item.name.toLowerCase().includes(searchVal)) {
                    return;
                }

                const state = itemStates[item.id];
                const packItemsCount = (item.packSize > 0 && state.packs > 0) ? state.packs * item.packSize : 0;
                const totalPieceInputSum = state.pieces.reduce((acc, curr) => acc + (parseFloat(curr) || 0), 0);
                const grandTotal = packItemsCount + totalPieceInputSum;

                if (grandTotal > 0 || state.packs > 0 || state.pieces.some(p => p > 0)) {
                    totalCounted++;
                }

                const card = document.createElement('div');
                card.className = "bg-white p-4 sm:p-5 rounded-2xl border border-cafe-200 shadow-sm hover:shadow-md transition-all";

                let html = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-cafe-100">
                        <div>
                            <h2 class="font-bold text-cafe-800 text-base sm:text-lg flex items-center gap-2">
                                ${item.name}
                                ${item.packSize > 0 ? `<span class="bg-cafe-100 text-cafe-700 text-xs px-2.5 py-0.5 rounded-full font-normal">แพ็คละ ${item.packSize} ${item.unit}</span>` : ''}
                            </h2>
                        </div>
                        <div class="text-right flex items-center justify-between sm:justify-end gap-3 bg-cafe-50 px-3 py-1.5 rounded-xl">
                            <span class="text-xs text-cafe-500 font-medium">รวมทั้งหมด:</span>
                            <span class="text-lg font-bold text-cafe-700" id="total_display_${item.id}">
                                ${grandTotal.toLocaleString()} <span class="text-xs font-normal text-cafe-600">${item.unit}</span>
                            </span>
                        </div>
                    </div>

                    <div class="mt-4 grid grid-cols-1 ${item.packSize > 0 ? 'md:grid-cols-2' : ''} gap-4">
                `;

                // Render Pack Input Section if item has pack size
                if (item.packSize > 0) {
                    html += `
                        <div class="bg-cafe-50/70 p-3 rounded-xl border border-cafe-100">
                            <label class="block text-xs font-semibold text-cafe-600 mb-1.5">
                                <i class="fa-solid fa-box text-cafe-500 mr-1"></i> จำนวนแพ็ค
                            </label>
                            <div class="flex items-center space-x-2">
                                <input type="number" min="0" value="${state.packs || ''}" placeholder="0" 
                                    oninput="updatePack('${item.id}', this.value)"
                                    class="w-full px-3 py-2 bg-white border border-cafe-200 rounded-lg text-sm focus:ring-2 focus:ring-cafe-400 focus:outline-none font-semibold text-cafe-800">
                                <span class="text-xs text-cafe-500 whitespace-nowrap">แพ็ค</span>
                            </div>
                            <div class="mt-1 text-[11px] text-cafe-500 text-right">
                                = <span class="font-medium text-cafe-700">${packItemsCount.toLocaleString()}</span> ${item.unit}
                            </div>
                        </div>
                    `;
                }

                // Render Dynamic Piece Inputs Section
                html += `
                    <div class="bg-cafe-50/70 p-3 rounded-xl border border-cafe-100 ${item.packSize === 0 ? 'w-full' : ''}">
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="text-xs font-semibold text-cafe-600">
                                <i class="fa-solid fa-cubes text-cafe-500 mr-1"></i> จำนวน (นับเป็น ${item.unit})
                            </label>
                            <button onclick="addPieceInput('${item.id}')" class="text-xs bg-cafe-200 hover:bg-cafe-300 text-cafe-800 font-medium px-2 py-0.5 rounded-md transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-plus text-[10px]"></i> เพิ่มช่องนับ
                            </button>
                        </div>
                        <div class="space-y-2" id="piece_container_${item.id}">
                `;

                state.pieces.forEach((val, idx) => {
                    html += `
                        <div class="flex items-center space-x-2">
                            <input type="number" min="0" value="${val || ''}" placeholder="0" 
                                oninput="updatePiece('${item.id}', ${idx}, this.value)"
                                class="w-full px-3 py-1.5 bg-white border border-cafe-200 rounded-lg text-sm focus:ring-2 focus:ring-cafe-400 focus:outline-none font-medium text-cafe-800">
                            ${state.pieces.length > 1 ? `
                                <button onclick="removePieceInput('${item.id}', ${idx})" class="text-rose-400 hover:text-rose-600 p-1 rounded transition-colors" title="ลบช่องนี้">
                                    <i class="fa-solid fa-circle-xmark"></i>
                                </button>
                            ` : ''}
                        </div>
                    `;
                });

                html += `
                        </div>
                        ${state.pieces.length > 1 ? `
                            <div class="mt-1.5 text-[11px] text-cafe-500 text-right border-t border-cafe-200/50 pt-1">
                                รวมช่องนับชิ้น: <span class="font-medium text-cafe-700">${totalPieceInputSum.toLocaleString()}</span> ${item.unit}
                            </div>
                        ` : ''}
                    </div>
                </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });

            document.getElementById('countedCount').textContent = totalCounted;
            updateStickySummary();
        }

        // State update handlers
        function updatePack(itemId, val) {
            const numVal = parseFloat(val) || 0;
            itemStates[itemId].packs = numVal >= 0 ? numVal : 0;
            updateItemTotalDisplay(itemId);
        }

        function updatePiece(itemId, index, val) {
            const numVal = parseFloat(val) || 0;
            itemStates[itemId].pieces[index] = numVal >= 0 ? numVal : 0;
            updateItemTotalDisplay(itemId);
        }

        function addPieceInput(itemId) {
            itemStates[itemId].pieces.push(0);
            renderItems();
        }

        function removePieceInput(itemId, index) {
            if (itemStates[itemId].pieces.length > 1) {
                itemStates[itemId].pieces.splice(index, 1);
                renderItems();
            }
        }

        function updateItemTotalDisplay(itemId) {
            const item = initialItems.find(i => i.id === itemId);
            const state = itemStates[itemId];
            
            const packItemsCount = (item.packSize > 0 && state.packs > 0) ? state.packs * item.packSize : 0;
            const totalPieceInputSum = state.pieces.reduce((acc, curr) => acc + (parseFloat(curr) || 0), 0);
            const grandTotal = packItemsCount + totalPieceInputSum;

            const displayEl = document.getElementById(`total_display_${itemId}`);
            if (displayEl) {
                displayEl.innerHTML = `${grandTotal.toLocaleString()} <span class="text-xs font-normal text-cafe-600">${item.unit}</span>`;
            }

            updateCountedItemsBadge();
            updateStickySummary();
        }

        function updateCountedItemsBadge() {
            let totalCounted = 0;
            initialItems.forEach(item => {
                const state = itemStates[item.id];
                if (state.packs > 0 || state.pieces.some(p => p > 0)) {
                    totalCounted++;
                }
            });
            document.getElementById('countedCount').textContent = totalCounted;
        }

        function updateStickySummary() {
            let totalActiveItems = 0;
            initialItems.forEach(item => {
                const state = itemStates[item.id];
                const packItemsCount = (item.packSize > 0 && state.packs > 0) ? state.packs * item.packSize : 0;
                const totalPieceInputSum = state.pieces.reduce((acc, curr) => acc + (parseFloat(curr) || 0), 0);
                if (packItemsCount + totalPieceInputSum > 0) {
                    totalActiveItems++;
                }
            });
            document.getElementById('stickyTotalUnits').textContent = `${totalActiveItems} รายการที่มีของคงเหลือ`;
        }

        function resetAllInputs() {
            if (confirm('คุณต้องการล้างข้อมูลการนับสต็อกทั้งหมดใช่หรือไม่?')) {
                initialItems.forEach(item => {
                    itemStates[item.id] = {
                        packs: 0,
                        pieces: [0]
                    };
                });
                renderItems();
                showToast('ล้างข้อมูลเรียบร้อยแล้ว');
            }
        }

        // Summary Modal Functions
        function openSummaryModal() {
            const modal = document.getElementById('summaryModal');
            const modalContent = document.getElementById('modalContent');
            const textArea = document.getElementById('summaryTextArea');

            const dateStr = new Date().toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            let textOutput = `📋 สรุปรายการนับสต็อกคาเฟ่\n📅 วันที่: ${dateStr}\n----------------------------------\n`;
            let activeCount = 0;

            initialItems.forEach(item => {
                const state = itemStates[item.id];
                const packItemsCount = (item.packSize > 0 && state.packs > 0) ? state.packs * item.packSize : 0;
                const pieceSum = state.pieces.reduce((acc, curr) => acc + (parseFloat(curr) || 0), 0);
                const grandTotal = packItemsCount + pieceSum;

                if (grandTotal > 0 || state.packs > 0 || state.pieces.some(p => p > 0)) {
                    activeCount++;
                    textOutput += `▫️ ${item.name}: ${grandTotal.toLocaleString()} ${item.unit}`;
                    
                    // Detailed breakdown for clear auditing
                    let details = [];
                    if (item.packSize > 0 && state.packs > 0) {
                        details.push(`${state.packs} แพ็ค`);
                    }
                    if (pieceSum > 0) {
                        details.push(`เศษ ${pieceSum} ${item.unit}`);
                    }
                    if (details.length > 0) {
                        textOutput += ` (${details.join(' + ')})`;
                    }
                    textOutput += `\n`;
                }
            });

            if (activeCount === 0) {
                textOutput += `ยังไม่มีการกรอกข้อมูลการนับสต็อก`;
            } else {
                textOutput += `----------------------------------\nรวมทั้งหมด ${activeCount} รายการ`;
            }

            textArea.value = textOutput;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeSummaryModal() {
            const modal = document.getElementById('summaryModal');
            const modalContent = document.getElementById('modalContent');

            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            modal.classList.add('opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function copySummaryText() {
            const textArea = document.getElementById('summaryTextArea');
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToast('คัดลอกรายงานสรุปเรียบร้อยแล้ว!');
            } catch (err) {
                showToast('ไม่สามารถคัดลอกได้');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-y-[-150%]');
            toast.classList.add('translate-y-0');

            setTimeout(() => {
                toast.classList.remove('translate-y-0');
                toast.classList.add('translate-y-[-150%]');
            }, 2500);
        }

        // Initialize App on Load
        window.onload = function() {
            initData();
        };
